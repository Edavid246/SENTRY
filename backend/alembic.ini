# Alembic configuration for the Defence Gateway core schema.
# Always invoke from the backend/ directory (or override sqlalchemy.url and
# script_location programmatically, as tests/integration/conftest.py does).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Empty on purpose: env.py fills it from ALEMBIC_DATABASE_URL or Settings.
sqlalchemy.url =
