[project]
name = "defence-gateway"
version = "0.1.0"
description = "Defence Gateway AI — MVP backend (all demo data is fictitious)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "pgvector>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "backend"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
